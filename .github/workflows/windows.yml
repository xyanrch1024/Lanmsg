name: windows-build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Copy helper batch
        shell: pwsh
        run: Copy-Item run-two-instances.bat build\Release\run-two-instances.bat

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          windeployqt --release --no-translations build\Release\qlanmsg.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\Release\qlanmsg.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlanmsg-windows-x64
          path: build/Release
          if-no-files-found: error
